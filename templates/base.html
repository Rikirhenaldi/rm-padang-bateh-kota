{% load static %}
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ restaurant.name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body data-wa-number="{{ restaurant.whatsapp }}" data-shopee-url="{{ restaurant.shopee_url }}">
  {% include "partials/nav.html" %}
  {% block content %}{% endblock %}
  {% include "partials/footer.html" %}
  {% include "partials/fab.html" %}
  <div class="lightbox" data-lightbox hidden role="dialog" aria-modal="true" aria-label="Pratinjau gambar"><div class="lightbox-backdrop" data-lightbox-close></div><div class="lightbox-dialog"><button class="lightbox-close" type="button" data-lightbox-close aria-label="Tutup gambar">×</button><div class="lightbox-visual" data-lightbox-visual></div><p class="lightbox-caption" data-lightbox-caption></p></div></div>
  <script src="{% static 'js/site.js' %}"></script>
  <script src="{% static 'js/cart.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
