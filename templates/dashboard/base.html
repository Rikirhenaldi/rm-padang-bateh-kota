{% load static %}
<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Dashboard · RM Padang Bateh Kota{% endblock %}</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{% static 'css/site.css' %}"><link rel="stylesheet" href="{% static 'css/dashboard.css' %}"></head><body class="dashboard-body"><div class="dashboard-shell"><header class="dashboard-nav"><a class="logo" href="{% url 'dashboard' %}"><i>🍛</i>Dashboard</a><nav class="dashboard-nav-links"><a href="{% url 'dashboard-restaurant' %}">Restoran</a><a href="{% url 'dashboard-menu' %}">Menu</a><a href="{% url 'dashboard-categories' %}">Kategori</a><a href="{% url 'dashboard-gallery' %}">Galeri</a><a href="{% url 'dashboard-settings' %}">Pengaturan</a><a href="{% url 'dashboard-logout' %}">Keluar</a></nav></header>{% for message in messages %}<div class="alert {{ message.tags }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</div><script src="{% static 'js/dashboard.js' %}"></script></body></html>
