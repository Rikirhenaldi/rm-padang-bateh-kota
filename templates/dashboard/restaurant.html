{% extends "dashboard/base.html" %}{% block content %}<h1>Profil Restoran</h1><form class="dashboard-form" method="post">{% csrf_token %}<label>Nama<input name="name" value="{{ item.name }}" required></label><label>Tagline<input name="tagline" value="{{ item.tagline }}"></label><label>Deskripsi<textarea name="description">{{ item.description }}</textarea></label><label>Logo URL<input name="logo" value="{{ item.logo }}"></label><label>Alamat<textarea name="address">{{ item.address }}</textarea></label><label>Telepon<input name="phone" value="{{ item.phone }}"></label><label>WhatsApp<input name="whatsapp" value="{{ item.whatsapp }}"></label><label>ShopeeFood URL<input type="url" name="shopee_url" value="{{ item.shopee_url }}"></label><label>Google Maps URL<input type="url" name="google_maps_url" value="{{ item.google_maps_url }}"></label><label>Hari buka<input name="opening_days" value="{{ item.opening_hours.0.days }}"></label><label>Jam buka<input name="opening_hours" value="{{ item.opening_hours.0.hours }}"></label><label>Instagram<input name="instagram" value="{{ item.instagram }}"></label><label>Facebook<input name="facebook" value="{{ item.facebook }}"></label><label>TikTok<input name="tiktok" value="{{ item.tiktok }}"></label><button class="btn green" type="submit">Simpan profil</button></form>{% endblock %}
