{% extends "dashboard/base.html" %}{% block content %}<h1>{% if item.id %}Edit{% else %}Tambah{% endif %} Kategori</h1><form class="dashboard-form" method="post">{% csrf_token %}<label>Nama<input name="name" value="{{ item.name }}" required></label><label>Deskripsi<textarea name="description">{{ item.description }}</textarea></label><label>Urutan<input type="number" name="sort_order" value="{{ item.sort_order|default:1 }}" min="1"></label><label><input type="checkbox" name="active"{% if item.active or not item.id %} checked{% endif %}> Aktif</label><button class="btn green" type="submit">Simpan</button></form>{% endblock %}
