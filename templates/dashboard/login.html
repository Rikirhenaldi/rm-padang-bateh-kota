{% load static %}<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Masuk Dashboard · RM Padang Bateh Kota</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{% static 'css/site.css' %}"><link rel="stylesheet" href="{% static 'css/dashboard.css' %}"></head><body class="dashboard-body"><main class="login-page"><form class="login-box dashboard-form" method="post">{% csrf_token %}<h1>Masuk Dashboard</h1>{% for message in messages %}<div class="alert {{ message.tags }}">{{ message }}</div>{% endfor %}<label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn green" type="submit">Masuk</button><a href="{% url 'home' %}">Kembali ke situs</a></form></main></body></html>
