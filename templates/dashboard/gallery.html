{% extends "dashboard/base.html" %}{% block content %}<h1>Galeri</h1><form class="dashboard-form" method="post" action="{% url 'dashboard-gallery-upload' %}" enctype="multipart/form-data">{% csrf_token %}<label>Gambar<input type="file" name="image" accept=".jpg,.jpeg,.png,.webp" required></label><label>Keterangan<input name="caption"></label><button class="btn green" type="submit">Unggah</button></form><div class="dashboard-gallery">{% for image in items %}<figure><img src="{{ image.url }}" alt="{{ image.caption }}"><figcaption>{{ image.caption }}<form method="post" action="{% url 'dashboard-gallery-delete' image.id %}" data-confirm="Hapus gambar ini?">{% csrf_token %}<button class="btn sf" type="submit">Hapus</button></form></figcaption></figure>{% empty %}<p>Belum ada gambar.</p>{% endfor %}</div>{% endblock %}
