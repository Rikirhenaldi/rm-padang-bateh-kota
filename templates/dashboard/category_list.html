{% extends "dashboard/base.html" %}{% block content %}<div class="dashboard-actions"><h1 style="margin-right:auto">Kategori</h1><a class="btn lime" href="{% url 'dashboard-category-new' %}">Tambah kategori</a></div><table class="dashboard-table"><thead><tr><th>Nama</th><th>Urutan</th><th>Aksi</th></tr></thead><tbody>{% for item in items %}<tr><td>{{ item.name }}</td><td>{{ item.sort_order }}</td><td class="actions"><a class="btn green" href="{% url 'dashboard-category-edit' item.id %}">Edit</a><form method="post" action="{% url 'dashboard-category-delete' item.id %}" data-confirm="Hapus kategori ini?">{% csrf_token %}<button class="btn sf" type="submit">Hapus</button></form></td></tr>{% endfor %}</tbody></table>{% endblock %}
