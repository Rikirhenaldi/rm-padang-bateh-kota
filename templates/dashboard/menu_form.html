{% extends "dashboard/base.html" %}{% block content %}<h1>{% if item.id %}Edit{% else %}Tambah{% endif %} Menu</h1><form class="dashboard-form" method="post">{% csrf_token %}<label>Nama<input name="name" value="{{ item.name }}" required></label><label>Kategori<select name="category_id" required>{% for category in categories %}<option value="{{ category.id }}"{% if item.category_id == category.id %} selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label><label>Deskripsi<textarea name="description">{{ item.description }}</textarea></label><label>Harga<input type="number" name="price" value="{{ item.price }}" min="0" required></label><label>Gambar URL<input name="image" value="{{ item.image|default:'' }}"></label><label>Warna piring<input type="color" name="plate_color" value="{{ item.plate_color|default:'#EE8A3A' }}"></label><label>Warna latar<input type="color" name="plate_bg" value="{{ item.plate_bg|default:'#F8D340' }}"></label><label>Label<input name="badge" value="{{ item.badge }}"></label><label>Urutan<input type="number" name="sort_order" value="{{ item.sort_order|default:1 }}" min="1"></label><label><input type="checkbox" name="available"{% if item.available or not item.id %} checked{% endif %}> Tersedia</label><label><input type="checkbox" name="featured"{% if item.featured %} checked{% endif %}> Unggulan</label><label><input type="checkbox" name="price_verified"{% if item.price_verified %} checked{% endif %}> Harga terverifikasi</label><button class="btn green" type="submit">Simpan</button></form>{% endblock %}
