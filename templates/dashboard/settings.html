{% extends "dashboard/base.html" %}{% block content %}<h1>Pengaturan</h1><form class="dashboard-form" method="post">{% csrf_token %}<label>Catatan harga<textarea name="price_note">{{ item.price_note }}</textarea></label><label>Jumlah menu di beranda<input type="number" name="home_menu_limit" value="{{ item.home_menu_limit }}" min="1"></label><label>Cara pesan, pisahkan dengan koma<input name="order_methods" value="{% for method in item.order_methods %}{{ method }}{% if not forloop.last %}, {% endif %}{% endfor %}"></label><label><input type="checkbox" name="show_price_note"{% if item.show_price_note %} checked{% endif %}> Tampilkan catatan harga</label><label><input type="checkbox" name="show_gallery"{% if item.show_gallery %} checked{% endif %}> Tampilkan galeri</label><button class="btn green" type="submit">Simpan pengaturan</button></form>{% endblock %}
