{% extends "dashboard/base.html" %}{% block content %}<div class="dashboard-actions"><h1 style="margin-right:auto">Menu</h1><a class="btn lime" href="{% url 'dashboard-menu-new' %}">Tambah menu</a></div><div style="overflow:auto"><table class="dashboard-table"><thead><tr><th>Nama</th><th>Kategori</th><th>Harga</th><th>Status</th><th>Aksi</th></tr></thead><tbody>{% for item in items %}<tr><td>{{ item.name }}</td><td>{{ item.category_id }}</td><td>Rp{{ item.price }}</td><td>{% if item.available %}Aktif{% else %}Nonaktif{% endif %}</td><td class="actions"><a class="btn green" href="{% url 'dashboard-menu-edit' item.id %}">Edit</a><form method="post" action="{% url 'dashboard-menu-delete' item.id %}" data-confirm="Hapus menu ini?">{% csrf_token %}<button class="btn sf" type="submit">Hapus</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
