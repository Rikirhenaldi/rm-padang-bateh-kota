{% load rm_extras %}<article class="pcard" data-menu-id="{{ item.id }}" data-category="{{ item.category_id }}" data-name="{{ item.name|lower }}"{% if not item.available %} data-unavailable="true"{% endif %}><div class="plate" style="background:{{ item.plate_bg }}">
  {% if item.image %}<button class="image-trigger" type="button" data-lightbox-src="{{ item.image }}" data-lightbox-alt="{{ item.name }}"><img src="{{ item.image }}" alt="{{ item.name }}" loading="lazy"></button>{% else %}<button class="image-trigger image-trigger-svg" type="button" data-lightbox-inline data-lightbox-alt="{{ item.name }}">{% include "partials/plate.html" with color=item.plate_color %}</button>{% endif %}
  {% if item.badge %}<span class="tag">{{ item.badge }}</span>{% endif %}</div>
  <div class="pbody"><h3>{{ item.name }}</h3><p>{{ item.description }}</p>
  <div class="row"><span class="price">{{ item.price|rupiah }}</span><span class="qty"><button type="button" data-cart-dec="{{ item.id }}" aria-label="Kurangi {{ item.name }}">−</button><output data-cart-qty="{{ item.id }}">0</output><button type="button" data-cart-inc="{{ item.id }}" aria-label="Tambah {{ item.name }}">+</button></span></div>
  <div class="acts"><button type="button" class="btn wa" data-cart-item="{{ item.id }}">WhatsApp</button><a class="btn sf" href="{{ restaurant.shopee_url }}" target="_blank" rel="noopener">ShopeeFood</a></div></div></article>
